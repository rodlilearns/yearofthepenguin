apiVersion: lvm.topolvm.io/v1alpha1
kind: LVMCluster
metadata:
  name: lvmcluster
  namespace: openshift-storage
spec:
  storage:
    deviceClasses:
      - name: vdi-local-block
        default: true
        thinPoolConfig:
          name: vdi-thin-pool
          sizePercent: 90
          overprovisionRatio: 10
