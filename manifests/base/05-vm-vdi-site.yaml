---
apiVersion: v1
kind: Namespace
metadata:
  name: vdi-desktops
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vdi-sa
  namespace: vdi-desktops
---
# 1. Define the Clone Source permission Role explicitly in openshift-cnv
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vdi-clone-source-grant
  namespace: openshift-cnv
rules:
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["datavolumes", "datavolumes/source"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
---
# 2. Bind vdi-sa to that Role in openshift-cnv
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: allow-vdi-cloning-launcher
  namespace: openshift-cnv
subjects:
  - kind: ServiceAccount
    name: vdi-sa
    namespace: vdi-desktops
roleRef:
  kind: Role
  name: vdi-clone-source-grant
  apiGroup: rbac.authorization.k8s.io
---
# 3. Define local DataVolume & PVC management Role in vdi-desktops
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vdi-dv-manager
  namespace: vdi-desktops
rules:
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["datavolumes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
# 4. Bind vdi-sa to local management Role in vdi-desktops
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: allow-create-dv-pvc
  namespace: vdi-desktops
subjects:
  - kind: ServiceAccount
    name: vdi-sa
    namespace: vdi-desktops
roleRef:
  kind: Role
  name: vdi-dv-manager
  apiGroup: rbac.authorization.k8s.io